<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuestiona</title>
<meta name="description" content="Convierte videos, audios y textos en lecciones interactivas con preguntas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: amable y escolar, como una herramienta de sala de profesores; directa.
   IDEA: un reproductor de video con marcadores de pregunta sobre su línea de tiempo.
   PICTURE: el formulario y el editor con su línea de tiempo; arriba, una pantalla con subtítulos y marcadores.
   COLOUR and TYPE: verde profundo como campo, coral para acciones, amarillo para foco; Nunito 800/900 + Inter.
   LAYOUT: barra superior, menú lateral (barra inferior en celular, lista para Android), tarjetas. */
:root{color-scheme:light dark;--bg:light-dark(#f3f6f5,#0f1413);--card:light-dark(#fff,#18201e);--ink:light-dark(#16201d,#e9f0ed);--mute:light-dark(#57665f,#9fb0aa);--line:light-dark(#dce5e1,#2a3531);--soft:light-dark(#ecf2ef,#1f2926);--deep:light-dark(#0f5c4d,#0d4a3f);--deepT:light-dark(#0f5c4d,#7fe0c7);--brand:#ff5b3a;--brand2:#e8462a;--sun:#ffc94d;--ok:light-dark(#0f8a5f,#4fd1a1);--bad:light-dark(#c4362a,#ff8b7d);--r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.25)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Nunito,Inter,sans-serif;font-weight:800;line-height:1.08;margin:0 0 .35em;text-wrap:balance}
h1{font-size:clamp(28px,4vw,44px)}h2{font-size:clamp(20px,2.6vw,26px)}h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:60px;padding:0 max(2vw,12px);background:var(--card);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:6px;border-radius:10px;font:900 24px/1 Nunito,sans-serif;letter-spacing:-.02em}
.grow{flex:1}.sync{font-size:13px;color:var(--mute);white-space:nowrap}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);background:var(--card);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:60px;height:calc(100vh - 60px)}
.side button,.bottom button{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;font-weight:500}
.side button:hover{background:var(--soft)}
.side button.on{background:color-mix(in srgb,var(--deep) 14%,transparent);color:var(--deepT);font-weight:700}
.side .cnt{margin-left:auto;font-size:12px;background:var(--soft);border-radius:999px;padding:1px 8px;color:var(--mute)}
.sidefoot{margin-top:auto;font-size:13px;color:var(--mute);padding:10px}
.bottom{display:none}
main{padding-bottom:48px}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px);max-width:1240px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--mute)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}.btn.brand:hover{background:var(--brand2)}
.btn.big{min-height:50px;padding:10px 26px;font-size:16px}
.btn.ghost{background:transparent}.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.6;cursor:progress}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
label{display:grid;gap:6px;font-weight:600;font-size:14px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;font-weight:400}
textarea{resize:vertical;line-height:1.45}
.hint,.meta,.lead{color:var(--mute);font-size:14px;margin:.25em 0 0;font-weight:400}
.lead{font-size:16px;max-width:64ch}
.hero{background:var(--deep);color:#fff}
.hero-in{max-width:1240px;padding:clamp(24px,4vw,48px) max(4vw,16px) 84px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center}
.hero p{color:#d3ebe4;font-size:17px;max-width:50ch;margin:0}
.hero svg{width:100%;max-width:460px;height:auto;justify-self:end}
.gen{max-width:900px;padding:clamp(16px,3vw,28px);display:grid;gap:18px}
.lift{margin-top:-84px;position:relative}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--soft);padding:5px;border-radius:999px;width:fit-content;max-width:100%}
.tabs button{border:0;background:none;padding:8px 16px;min-height:40px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--mute)}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.srcp{display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.chips{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.chips legend{font-weight:600;font-size:14px;margin-bottom:8px;padding:0}
.chip{display:inline-block;position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.chip span{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:6px 14px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;font-weight:500}
.chip input:checked+span{border-color:var(--deepT);background:color-mix(in srgb,var(--deep) 12%,transparent)}
.chip input:focus-visible+span{outline:3px solid var(--sun)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between}
.inline{display:inline-grid}
.status{min-height:1.4em;font-size:14px;color:var(--mute)}.status.err,.capnote{color:var(--bad)}
.capnote{font-size:14px;margin:0}.capnote:empty{display:none}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:22px;max-width:900px}
.how div{padding:14px 16px;border-left:3px solid var(--brand);background:var(--card);border-radius:0 12px 12px 0}
.how b{display:block;font-family:Nunito,sans-serif;font-size:17px}
.how span{font-size:14px;color:var(--mute)}
.edtop{padding:20px max(3vw,16px) 6px;display:grid;gap:4px}
.title{font:800 clamp(22px,3vw,30px)/1.15 Nunito,sans-serif;border:1px solid transparent;background:transparent;padding:6px 8px;margin-left:-8px}
.title:hover,.title:focus{border-color:var(--line);background:var(--card)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tl{padding:10px max(3vw,16px) 4px}
.tlbar{position:relative;height:40px;margin:0 10px}
.tlbar::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--line)}
.mk{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid var(--card);background:var(--c);cursor:pointer;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.mk::after{content:"";position:absolute;inset:-12px}
.mk.on{transform:scale(1.35);box-shadow:0 0 0 2px var(--ink)}
.tlx{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.ed{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;padding:12px max(3vw,16px);align-items:start}
.events{display:grid;gap:8px;position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto;padding:3px}
.evh{display:flex;justify-content:space-between;font-weight:700;padding:0 4px}
.ev{display:grid;grid-template-columns:1fr auto;gap:4px 8px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer}
.ev.on{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.evt{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--c)}
.evtime{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.evq{grid-column:1/-1;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.add{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 4px;font-size:13px;color:var(--mute)}
.mini{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--c);cursor:pointer;display:grid;place-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.qedit{padding:clamp(14px,2.5vw,24px);display:grid;gap:14px}
.qh{display:flex;flex-wrap:wrap;align-items:end;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:700;font-size:14px;align-self:center;width:fit-content}
.sm input,.sm select{min-height:40px;padding:6px 10px}.tin{width:96px;font-variant-numeric:tabular-nums}
.qh .danger{margin-left:auto}
.lbl{font-weight:600;font-size:14px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px;border:1.5px solid var(--line);border-radius:12px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.ck{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:800;color:#fff}
.opt.ok .ck{background:var(--ok);border-color:var(--ok)}
.num{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--soft);font-weight:700}
.ofields{display:grid;gap:6px}.fb{font-size:14px;min-height:38px;color:var(--mute)}
.x{width:40px;height:40px;border:0;background:none;font-size:22px;color:var(--mute);cursor:pointer;border-radius:8px}.x:hover{background:var(--soft)}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 80px auto;gap:8px}
.resp{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}.resp p{margin:.3em 0 0;font-style:italic}
.link{color:var(--deepT);font-weight:600}
.empty{color:var(--mute)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.lcard{display:grid;grid-template-rows:auto 1fr;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.thumb{background:var(--deep);aspect-ratio:2/1}.thumb.doc{background:#24497f}.thumb.texto{background:#6b4a2e}
.thumb svg{display:block;width:100%;height:100%}
.lb{padding:14px;display:grid;gap:4px;align-content:start}
.lb .acts .btn{min-height:40px;padding:6px 12px;font-size:14px}
.emptyb,.note{padding:24px;border:2px dashed var(--line);border-radius:var(--r);color:var(--mute);text-align:center}
.note{border-style:solid;text-align:left;padding:12px 16px;margin:0 0 14px}
.stu{max-width:780px;margin:0 auto;padding:clamp(20px,3vw,40px) 16px;display:grid;gap:16px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--brand);transition:width .3s}
.watch{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--deep);color:#fff;border-radius:var(--r);padding:16px 18px}
.watch .btn{background:#fff;color:#0f5c4d;border-color:#fff}
.sq{padding:clamp(16px,3vw,28px);display:grid;gap:14px}
.ans{display:grid;gap:10px}
.ans button{text-align:left;min-height:52px;padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:16px}
.ans button:hover:not(:disabled){border-color:var(--brand)}
.ans button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.ans button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.ans button:disabled{cursor:default;color:inherit}
.fbk{padding:12px 14px;border-radius:12px;background:var(--soft);font-size:15px}
.score{font:900 clamp(52px,9vw,80px)/1 Nunito,sans-serif;color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.flag{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:min(560px,92vw);font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--sun);font-weight:700;cursor:pointer;min-height:36px}
.scroll{overflow-x:auto}
.play{padding:16px max(2vw,12px) 24px;display:grid;gap:12px;max-width:1500px}
.play .hrow h2{flex:1;min-width:0}
.pgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:18px;align-items:start}
.pv video{display:block;width:100%;max-height:calc(100vh - 230px);background:#000;border-radius:14px}
.ptl{position:relative;height:30px;margin:8px 10px 0}
.ptl::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--line)}
#pvfill{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--brand);width:0}
.mk.done{opacity:.55}
.pq{position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto;display:grid;gap:10px;align-content:start;padding:2px}
.pqh{display:flex;justify-content:space-between;align-items:center;padding:0 2px}
#pql{display:grid;gap:10px}
.qc{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:14px;display:grid;gap:10px}
.qc .pill{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.qc.nueva{animation:entra .45s ease-out;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent)}
@keyframes entra{from{opacity:0;transform:translateY(-10px)}}
.qc h3{font-size:18px;margin:0}
.qch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tm{border:0;background:var(--soft);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;min-height:36px;font-variant-numeric:tabular-nums;color:inherit}
@media(max-width:900px){.pgrid{grid-template-columns:minmax(0,1fr)}.pq{position:static;max-height:none}.pv video{max-height:50vh}}
.vbox{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;width:100%}
.vbox iframe,.vbox video,.vbox>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.pv .vbox{max-height:calc(100vh - 230px)}
.ed3{display:grid;grid-template-columns:270px minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"ev mid q";gap:18px;padding:12px max(2vw,14px);align-items:start}
.ed3 .events{grid-area:ev}.ed3 .qedit{grid-area:q}.edmid{grid-area:mid;position:sticky;top:72px;display:grid;gap:4px}
.edmid .tl{padding:8px 0 0}
.head{position:absolute;top:4px;bottom:4px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px;left:0;pointer-events:none;z-index:1}
@media(max-width:1200px){.ed3{grid-template-columns:280px minmax(0,1fr);grid-template-areas:"mid mid" "ev q"}.edmid{position:static}}
@media(max-width:760px){.ed3{grid-template-columns:minmax(0,1fr);grid-template-areas:"mid" "ev" "q"}}
details summary{cursor:pointer;font-weight:600}details ol{margin:.5em 0 0;padding-left:1.2em}
@media(max-width:960px){.ed{grid-template-columns:minmax(0,1fr)}.events{position:static;max-height:320px}}
@media(max-width:760px){
.shell{grid-template-columns:minmax(0,1fr)}.side{display:none}
.bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding:4px}
.bottom button{flex-direction:column;gap:2px;font-size:12px;justify-content:center;text-align:center;min-height:56px}
.bottom button.on{color:var(--brand);font-weight:700}
main{padding-bottom:96px}.toast{bottom:84px}
.hero-in{grid-template-columns:minmax(0,1fr);gap:18px}.hero svg{justify-self:center;max-width:360px}
.sync,.top .long{display:none}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}.opt{grid-template-columns:auto minmax(0,1fr)}.opt .x{grid-column:2;justify-self:end}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="top">
  <button class="logo" data-go="crear" aria-label="Cuestiona, inicio">
    <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 3h18a5 5 0 0 1 5 5v12a5 5 0 0 1-5 5H14l-6.5 5v-5H7a5 5 0 0 1-5-5V8a5 5 0 0 1 5-5z" fill="#ff5b3a"/><path d="M13 9.2v10.6l8.6-5.3z" fill="#fff"/><circle cx="25" cy="8" r="2.2" fill="#ffc94d"/></svg>
    <span>cuestiona</span>
  </button>
  <div class="grow"></div>
  <span id="sync" class="sync"></span>
  <button class="btn brand" data-go="crear">+ <span class="long">Nueva lección</span></button>
</header>
<div class="shell">
  <nav class="side" aria-label="Menú">
    <button data-go="crear"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Crear lección</button>
    <button data-go="lecciones"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6h7l2 2h9v11H3z"/></svg>Mis lecciones <span class="cnt" id="cnt">0</span></button>
    <button data-go="corregir"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l5 5L20 7"/></svg>Corregir abiertas</button>
    <button data-go="ajustes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Ajustes</button>
    <p class="sidefoot">Las preguntas las propone la IA a partir del contenido. Revísalas siempre antes de usarlas con tu curso. Tu clave y tus lecciones se guardan solo en este navegador.</p>
  </nav>
  <main id="main"></main>
</div>
<nav class="bottom" aria-label="Menú">
  <button data-go="crear"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Crear</button>

function parseJSON(t){t=String(t||'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)return null;try{return JSON.parse(t.slice(a,b+1))}catch(e){return null}}
const ytId=u=>{u=String(u||'').trim();const m=u.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);return m?m[1]:(/^[A-Za-z0-9_-]{11}$/.test(u)?u:null)};

async function claudeAPI(prompt,o={}){if(!CFG.key)throw Object.assign(new Error('Falta tu clave de API de Anthropic. Agrégala en Ajustes.'),{code:'no_key'});
  const content=[];for(const b of(o.images||[]))content.push({type:'image',source:{type:'base64',media_type:b.type||'image/jpeg',data:await blob64(b)}});content.push({type:'text',text:prompt});
  let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':CFG.key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:CFG.model,max_tokens:o.maxTokens||16000,stream:true,messages:[{role:'user',content}]})})}
  catch(e){throw new Error('No hay conexión con la API de Claude. Revisa tu internet.')}
  if(!r.ok){let m='';try{const j=await r.json();m=j&&j.error&&j.error.message||''}catch(e){}throw Object.assign(new Error(apiMsg(r.status,m)),{code:'api_'+r.status})}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',text='',stop='';
  for(;;){const{value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,i);buf=buf.slice(i+2);const line=ev.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;let d;try{d=JSON.parse(line.slice(5))}catch(e){continue}
      if(d.type==='content_block_delta'&&d.delta&&d.delta.type==='text_delta'){text+=d.delta.text;if(o.onText)o.onText({text})}
      else if(d.type==='message_delta'&&d.delta&&d.delta.stop_reason)stop=d.delta.stop_reason;
      else if(d.type==='error')throw new Error('Error de la API: '+(d.error&&d.error.message||'desconocido'))}}
  if(!text.trim())throw new Error('La IA no devolvió texto. Vuelve a intentarlo.');return{text,truncated:stop==='max_tokens'}}

function agrupar(segs){const out=[];let cur=null;for(const s of segs){const x=String(s.x||'').replace(/\s+/g,' ').trim();if(!x)continue;if(!cur||s.t-cur.t>=20){cur={t:s.t,x:[]};out.push(cur)}cur.x.push(x)}return out.map(b=>`[${fmt(b.t)}] ${b.x.join(' ')}`).join('\n')}
function buscarTranscripcion(root){const res={segments:[],kind:'',error:''},seen=new Set();

/* ---------- reproductor: YouTube o archivo ---------- */
let ytP=null,PL=null;
function cargarYT(){if(window.YT&&window.YT.Player)return Promise.resolve(window.YT);if(ytP)return ytP;
  ytP=new Promise((ok,ko)=>{const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{try{prev&&prev()}catch(e){}ok(window.YT)};const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{ytP=null;ko(new Error('No se pudo cargar YouTube. Revisa tu conexión.'))};document.head.appendChild(s)});return ytP}
function destruirPlayer(){if(!PL)return;clearInterval(PL.timer);try{PL.destroy()}catch(e){}PL=null}
function montarPlayer(hostId,L,onTick){destruirPlayer();const host=$('#'+hostId);if(!host)return false;const url=S.media[L.id];
  if(url){host.innerHTML=`<video src="${esc(url)}" controls playsinline preload="auto"></video>`;const v=host.querySelector('video');
    PL={kind:'file',get:()=>v.currentTime||0,dur:()=>v.duration&&isFinite(v.duration)?v.duration:Math.max(1,L.duracion||1),seek:t=>{v.currentTime=t},play:()=>{v.play().catch(()=>{})},pause:()=>v.pause(),paused:()=>v.paused,destroy:()=>v.pause()};
    v.addEventListener('error',()=>{toast('No se pudo reproducir el archivo del video.');delete S.media[L.id];idb.del(L.id)})}
  else if(L.videoId){host.innerHTML='<div id="ytp-'+hostId+'"></div>';const me={kind:'yt',yt:null,get(){try{return me.yt.getCurrentTime()||0}catch(e){return 0}},dur(){try{return me.yt.getDuration()||Math.max(1,L.duracion||1)}catch(e){return Math.max(1,L.duracion||1)}},seek(t){try{me.yt.seekTo(t,true)}catch(e){}},play(){try{me.yt.playVideo()}catch(e){}},pause(){try{me.yt.pauseVideo()}catch(e){}},paused(){try{return me.yt.getPlayerState()!==1}catch(e){return true}},destroy(){try{me.yt.destroy()}catch(e){}}};PL=me;
    cargarYT().then(YT=>{if(PL!==me)return;me.yt=new YT.Player('ytp-'+hostId,{videoId:L.videoId,width:'100%',height:'100%',playerVars:{rel:0,playsinline:1,modestbranding:1},events:{onError:e=>toast(e.data===101||e.data===150||e.data===153?'El dueño de este video no permite verlo fuera de YouTube. Usa otro video o sube el archivo.':'YouTube no pudo reproducir este video (código '+e.data+').')}})}).catch(e=>{host.innerHTML=`<p class="empty" style="color:#fff;padding:16px">${esc(e.message)}</p>`})}
  else return false;
  PL.timer=setInterval(()=>{if(PL)onTick(PL.get(),PL.dur())},250);return true}

/* ---------- guardar videos en este navegador ---------- */
const idb=(()=>{let p=null;const open=()=>p||(p=new Promise((ok,ko)=>{try{const r=indexedDB.open('cuestiona',1);r.onupgradeneeded=()=>r.result.createObjectStore('videos');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}}).catch(e=>{p=null;throw e}));
  const run=(mode,fn)=>open().then(db=>new Promise((ok,ko)=>{const t=db.transaction('videos',mode),r=fn(t.objectStore('videos'));t.oncomplete=()=>ok(r?r.result:undefined);t.onerror=()=>ko(t.error);t.onabort=()=>ko(t.error)}));
  return{get:k=>run('readonly',s=>s.get(k)).catch(()=>null),set:(k,v)=>run('readwrite',s=>s.put(v,k)).catch(()=>null),del:k=>run('readwrite',s=>s.delete(k)).catch(()=>null)}})();

function qCard(i,nueva){const q=S.cur.preguntas[i],a=S.st.ans[i];let body='';
  if(q.tipo==='multiple'||q.tipo==='encuesta'){body=`<div class="ans">${q.opciones.map((o,j)=>{let c='';if(a){if(q.tipo==='multiple'){if(o.correcta)c='ok';else if(a.j===j)c='bad'}else if(a.j===j)c='ok'}return`<button data-act="vresp" data-i="${i}" data-j="${j}" class="${c}" ${a?'disabled':''}>${esc(o.texto)}</button>`}).join('')}</div>`;
    if(a&&q.tipo==='multiple'){const o=q.opciones[a.j]||{};body+=`<div class="fbk"><b>${a.ok?'¡Correcto!':'No es correcta.'}</b> ${esc(o.feedback||'')}${a.ok?'':`<br>Correcta: ${esc(q.opciones.filter(x=>x.correcta).map(x=>x.texto).join(' / '))}`}</div>`}}
  else if(q.tipo!=='nota')body=a?`<div class="fbk">${esc(a.texto)}</div>`:`<textarea id="vt-${i}" rows="3" placeholder="Escribe tu respuesta" aria-label="Respuesta"></textarea><div><button class="btn brand" data-act="vsave" data-i="${i}">Guardar respuesta</button></div>`;
  return`<article class="qc ${nueva?'nueva':''}" id="qc-${i}" style="--c:${TIPOS[q.tipo].c}"><div class="qch"><span class="pill">${ico(q.tipo,15)} ${TIPOS[q.tipo].n}</span><button class="tm" data-act="seek" data-t="${q.t}" title="Volver a este momento">${fmt(q.t)}</button></div><h3>${esc(q.enunciado)}</h3>${body}</article>`}
function bindPlayer(){if(!$('#pvh'))return;const L=S.cur,st=S.st,qs=L.preguntas;let fin=false,lastMax=0;
  const tick=(t,dur)=>{const f=$('#pvfill');if(f)f.style.width=Math.min(100,t/dur*100)+'%';
    if(dur&&Math.abs(dur-lastMax)>1){lastMax=dur;document.querySelectorAll('#ptl .mk').forEach((m,i)=>{m.style.left=(Math.min(qs[i].t,dur)/dur*100).toFixed(2)+'%'})}
    qs.forEach((q,i)=>{if(st.shown[i]||q.t>t+0.25)return;if(q.t>0.5&&t-q.t>3&&PL&&PL.paused())return;st.shown[i]=true;const list=$('#pql');if(!list)return;const e=$('#pqempty');if(e)e.remove();list.insertAdjacentHTML('afterbegin',qCard(i,true));
      const mk=document.querySelectorAll('#ptl .mk')[i];if(mk)mk.classList.add('done');const c=$('#pqcount');if(c)c.textContent=`${Object.keys(st.shown).length} de ${qs.length}`;
      setTimeout(()=>{const el=$('#qc-'+i);if(el)el.classList.remove('nueva')},6000);
      if(st.pausa&&q.t>0.5&&PL&&!PL.paused())PL.pause()});
    if(!fin&&dur>2&&t>=dur-0.6){fin=true;toast('Terminó el video.',{label:'Ver resultados',act:'vres'})}};
  montarPlayer('pvh',L,tick)}

const filasGrade=()=>[['Estudiante','Respuesta','Puntaje','Máximo','Nivel','Retroalimentación','Revisar','Motivo']].concat(S.grade.res.map(r=>[r.estudiante,r.respuesta,r.puntaje,r.maximo,r.nivel,r.feedback,r.revisar?'Sí':'No',r.motivo||'']));
async function corregir(){const g=S.grade;if(g.busy)return;const fail=m=>{g.msg=m;g.err=true;render()};
  if(!CFG.key)return fail('Falta tu clave de API de Anthropic. Agrégala en Ajustes.');
  const L=todas().find(x=>x.id===g.lid);let preg,esp,crit;
  if(L){const q=L.preguntas.find(x=>x.id===g.qid);if(!q)return fail('Elige una pregunta abierta.');preg=q.enunciado;esp=q.esperada;crit=q.criterios.map(c=>`- ${c.criterio} (${c.puntos} pts)`).join('\n')}else{preg=g.preg;esp=g.esperada;crit=g.criterios}
  if(!String(preg||'').trim())return fail('Escribe la pregunta.');
  const est=String(g.resp||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,60).map((l,i)=>{const m=l.match(/^([^:]{1,40}):\s*(.+)$/);return m?{n:m[1].trim(),r:m[2].trim()}:{n:'Estudiante '+(i+1),r:l}});
  if(!est.length)return fail('Pega al menos una respuesta.');
  g.busy=true;g.msg='La IA está corrigiendo…';g.err=false;render();
  const p=`Eres un corrector docente de enseñanza media en Chile. Corrige cada respuesta SOLO con la pauta. No inventes criterios.
PREGUNTA: ${preg}
RESPUESTA ESPERADA: ${esp||'(no indicada)'}
CRITERIOS Y PUNTAJE:
${crit||'(no indicados: usa 0 a 3 puntos según calidad)'}

RESPUESTAS (en orden):
${est.map((e,i)=>`${i+1}. ${e.n}: ${e.r}`).join('\n')}

Devuelve un resultado por respuesta, en el mismo orden y con el mismo nombre. "feedback": 1 o 2 frases dirigidas al estudiante, en segunda persona, amables y concretas. Marca "revisar": true si la respuesta es ambigua, muy corta, fuera de tema o casi idéntica a otra, y explica en "motivo".
Responde SOLO con JSON válido: {"resultados":[{"estudiante":"","puntaje":0,"maximo":0,"nivel":"Logrado|Medianamente logrado|Por lograr","feedback":"","revisar":false,"motivo":""}]}`;
  try{const r=await cap.sample(p,{modelTier:'default'});const j=parseJSON(r&&r.text);if(!j||!Array.isArray(j.resultados))throw new Error('La IA no devolvió un formato válido. Vuelve a intentarlo.');
    g.res=est.map((e,i)=>{const x=j.resultados[i]||{};return{estudiante:String(x.estudiante||e.n),respuesta:e.r,puntaje:x.puntaje??'',maximo:x.maximo??'',nivel:String(x.nivel||''),feedback:String(x.feedback||''),revisar:!!x.revisar,motivo:String(x.motivo||'')}});
    g.msg='Revisa cada propuesta antes de poner nota.';g.err=false}
  catch(e){g.msg=e&&e.code?sampleMsg(e):'No se pudo corregir: '+(e.message||e);g.err=true}
  g.busy=false;if(S.view==='corregir')render()}

  if(el.id==='pv-file'&&S.cur){const fl=el.files&&el.files[0];if(!fl)return;S.media[S.cur.id]=URL.createObjectURL(fl);idb.set(S.cur.id,fl);render();return}
  if(S.view==='editor'&&el.dataset.f==='t'){ordenar();refreshEditor();return}

  if(S.view==='corregir'&&el.dataset.g2&&S.grade){S.grade[el.dataset.g2]=el.value;if(el.dataset.g2==='lid')S.grade.qid='';S.grade.res=null;render()}});
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j,k=b.dataset.k,id=b.dataset.id,L=S.cur,q=L&&L.preguntas?L.preguntas[S.sel]:null;

    case'add':{const max=tlMax(L),base=PL&&S.view==='editor'?Math.round(PL.get()):q?q.t+(L.modo==='video'?15:1):0,nq={id:uid(),t:Math.min(max,base),tipo:k,enunciado:'',opciones:[],esperada:'',criterios:[],respaldo:'',ubicacion:'',nivel:'Comprender'};ajustarTipo(nq);L.preguntas.push(nq);S.sel=L.preguntas.length-1;ordenar();S.sel=L.preguntas.indexOf(nq);refreshEditor();dirty();const t=$('#qedit textarea');if(t)t.focus();break}

    case'prep':{if(b.disabled)return;b.disabled=true;const ps=m=>{S.prep=m;const el=$('#prepst');if(el)el.textContent=m};ps('Cargando Whisper…');const t0=performance.now();
      cargarWhisper(p=>{if(p&&p.status==='progress'&&p.total>5e6)ps(`Descargando Whisper… ${Math.round(p.progress||0)}%`)}).then(async asr=>{ps('Probando…');const a=new Float32Array(16000*3);for(let i=0;i<a.length;i++)a[i]=0.2*Math.sin(i/16000*2*Math.PI*220)*Math.sin(i/16000*Math.PI*3);
        const t1=performance.now();await asr(a,{return_timestamps:true,task:'transcribe',language:'spanish'});ps(`Whisper listo ✓ (carga ${Math.round((t1-t0)/1000)} s, prueba ${((performance.now()-t1)/1000).toFixed(1)} s)`)})
        .catch(e=>ps('Whisper no pudo cargar: '+String(e&&e.message||e).slice(0,160))).finally(()=>{b.disabled=false});break}
    case'g-copy':copiar(tsv(filasGrade()),'Corrección copiada. Puedes pegarla en una planilla.');break;
    case'g-dl':bajar('correccion-abiertas.csv',csv(filasGrade()));break}});
initDB();render();setSync();
}
